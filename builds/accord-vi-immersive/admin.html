<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Executive Portal — Accord VI</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/styles.css">
<style>
  .admin-wrap { max-width: 68rem; margin: 0 auto; }

  .admin-loading {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--color-text-dim);
    font-size: 0.9rem;
  }
  .admin-spinner {
    width: 2rem;
    height: 2rem;
    border: 2px solid var(--color-border);
    border-top-color: var(--color-primary);
    border-radius: 50%;
    margin: 0 auto 1rem;
    animation: admin-spin 0.8s linear infinite;
  }
  @keyframes admin-spin { to { transform: rotate(360deg); } }

  .admin-login {
    max-width: 26rem;
    margin: 0 auto;
    animation: admin-fade-in 0.4s ease;
  }
  .admin-login label {
    display: block;
    font-family: var(--font-display);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--color-text-dim);
    margin-bottom: 0.5rem;
  }
  .admin-login input {
    width: 100%;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    padding: 0.9rem 1rem;
    color: var(--color-text);
    font-size: 1.05rem;
    font-family: inherit;
    margin-bottom: 1.25rem;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .admin-login input:focus {
    outline: none;
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px rgba(224, 180, 85, 0.15);
  }
  .admin-login label.show-password-toggle {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    margin: -0.75rem 0 1.25rem;
    text-transform: none;
    letter-spacing: normal;
    font-family: inherit;
    font-size: 0.85rem;
    color: var(--color-text-dim);
    cursor: pointer;
  }
  .admin-login input[type="checkbox"] {
    width: auto;
    margin: 0;
    padding: 0;
    background: none;
    border: none;
    accent-color: var(--color-primary);
    cursor: pointer;
  }
  .admin-note {
    margin-top: 0.9rem;
    font-size: 0.85rem;
    color: var(--color-text-dim);
    min-height: 1.2em;
  }
  .admin-note.is-error { color: #e0555a; }

  #logView { animation: admin-fade-in 0.4s ease; }
  @keyframes admin-fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .admin-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }
  .admin-search-wrap {
    position: relative;
    flex: 1 1 16rem;
    max-width: 22rem;
  }
  .admin-search-wrap svg {
    position: absolute;
    left: 0.9rem;
    top: 50%;
    transform: translateY(-50%);
    width: 1rem;
    height: 1rem;
    color: var(--color-text-faint);
    pointer-events: none;
  }
  .admin-search {
    width: 100%;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 999px;
    padding: 0.65rem 1rem 0.65rem 2.4rem;
    color: var(--color-text);
    font-size: 0.9rem;
    font-family: inherit;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .admin-search:focus {
    outline: none;
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px rgba(224, 180, 85, 0.15);
  }
  .admin-search::-webkit-search-cancel-button { cursor: pointer; }
  .admin-toolbar-right {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-left: auto;
  }
  .admin-count {
    font-family: var(--font-display);
    font-size: 0.85rem;
    color: var(--color-text-dim);
    white-space: nowrap;
  }
  .admin-count strong { color: var(--color-primary); }

  .admin-table-scroll {
    overflow: auto;
    max-height: 70vh;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    background: var(--color-surface);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.18);
  }
  table.admin-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
    min-width: 46rem;
  }
  .admin-table th, .admin-table td {
    padding: 0.85rem 1.1rem;
    text-align: left;
    border-bottom: 1px solid var(--color-border);
    vertical-align: top;
  }
  .admin-table th {
    font-family: var(--font-display);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--color-text-faint);
    background: var(--color-bg-alt);
    white-space: nowrap;
    position: sticky;
    top: 0;
  }
  .admin-table tr:last-child td { border-bottom: none; }
  .admin-table tbody tr {
    transition: background 0.15s ease;
    animation: admin-row-in 0.35s ease both;
  }
  .admin-table tbody tr:hover { background: var(--color-bg-alt); }
  @keyframes admin-row-in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .admin-table td.admin-cell-when { white-space: nowrap; color: var(--color-text-dim); font-size: 0.82rem; }
  .admin-table td.admin-cell-type { white-space: nowrap; }
  .admin-table td.admin-cell-type span {
    display: inline-block;
    padding: 0.22rem 0.65rem;
    border-radius: 999px;
    background: rgba(224, 180, 85, 0.12);
    color: var(--color-primary);
    font-size: 0.76rem;
    font-family: var(--font-display);
  }
  .admin-table td.admin-cell-details { color: var(--color-text-dim); font-size: 0.82rem; }
  .admin-table mark {
    background: rgba(224, 180, 85, 0.4);
    color: inherit;
    border-radius: 2px;
    padding: 0 0.1em;
  }
  .admin-empty {
    padding: 3.5rem 1.5rem;
    text-align: center;
    color: var(--color-text-dim);
  }

  @media (prefers-reduced-motion: reduce) {
    .admin-spinner { animation: none; }
    .admin-login, #logView, .admin-table tbody tr { animation: none; }
  }

  .admin-logout {
    background: none;
    border: 1px solid var(--color-border);
    border-radius: 999px;
    padding: 0.5rem 1.1rem;
    color: var(--color-text-dim);
    font-size: 0.85rem;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .admin-logout:hover { color: var(--color-text); border-color: var(--color-text-dim); }

  @media (max-width: 640px) {
    .admin-toolbar-right { margin-left: 0; width: 100%; justify-content: space-between; }
  }
</style>
</head>
<body>

<a href="#main" class="skip-link">Skip to content</a>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="resonance-mark" viewBox="0 0 120 120">
    <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
      <line x1="60" y1="8" x2="60" y2="112"></line>
      <path d="M66.8,41.2 A20,20 0 0 1 66.8,78.8"></path>
      <path d="M53.2,41.2 A20,20 0 0 0 53.2,78.8"></path>
      <path d="M71.6,28.1 A34,34 0 0 1 71.6,91.9"></path>
      <path d="M48.4,28.1 A34,34 0 0 0 48.4,91.9"></path>
      <path d="M76.4,14.9 A48,48 0 0 1 76.4,105.1"></path>
      <path d="M43.6,14.9 A48,48 0 0 0 43.6,105.1"></path>
    </g>
    <circle cx="60" cy="60" r="4" fill="currentColor"></circle>
  </symbol>
</svg>

<header class="site-header">
  <div class="container nav-inner">
    <a href="index.html" class="logo">
      <svg class="logo-mark" viewBox="0 0 120 120" aria-hidden="true"><use href="#resonance-mark"></use></svg>
      <span class="logo-text">Accord <span>VI</span></span>
    </a>
    <nav class="nav-links" id="navLinks">
      <a href="info.html" class="nav-link">Info</a>
      <a href="sponsor.html" class="nav-link">Sponsors</a>
      <a href="privacy-policy.html" class="nav-link">Privacy</a>
      <a href="register.html" class="nav-cta">Register</a>
    </nav>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="navLinks">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<section class="section" id="main">
  <div class="container admin-wrap">
    <p class="eyebrow" style="text-align:center;">Executives only</p>
    <h1 class="page-title" style="text-align:center; margin-bottom:2.5rem;">Registration log</h1>

    <div id="loadingView" class="admin-loading">
      <div class="admin-spinner" aria-hidden="true"></div>
      <p>Checking your session…</p>
    </div>

    <div id="loginView" class="admin-login" hidden>
      <form id="loginForm">
        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword" autocomplete="current-password" required>
        <label class="show-password-toggle" for="showPassword">
          <input type="checkbox" id="showPassword">
          <span>Show password</span>
        </label>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Sign in</button>
        <p class="admin-note" id="loginNote" role="status"></p>
      </form>
    </div>

    <div id="logView" hidden>
      <div class="admin-toolbar">
        <div class="admin-search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M21 21l-4.3-4.3"></path>
          </svg>
          <input type="search" id="adminSearch" class="admin-search" placeholder="Search by name or email…" aria-label="Search registrations">
        </div>
        <div class="admin-toolbar-right">
          <p class="admin-count" id="adminCount"></p>
          <button type="button" class="admin-logout" id="logoutBtn">Sign out</button>
        </div>
      </div>
      <div class="admin-table-scroll">
        <table class="admin-table" id="adminTable">
          <thead>
            <tr>
              <th>Submitted</th>
              <th>Type</th>
              <th>Name</th>
              <th>Email</th>
              <th>Details</th>
            </tr>
          </thead>
          <tbody id="adminTableBody"></tbody>
        </table>
      </div>
      <p class="admin-empty" id="adminEmpty" hidden>No registrations yet.</p>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container footer-inner">
    <span class="logo footer-logo">
      <svg class="logo-mark" viewBox="0 0 120 120" aria-hidden="true"><use href="#resonance-mark"></use></svg>
      <span class="logo-text">Accord <span>VI</span></span>
    </span>
    <p class="footer-tag">18–19 October · Beaconhouse Cantt Campus, Multan</p>
    <p class="footer-copy">© <span id="year"></span> Accord VI. All rights reserved.</p>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  const navToggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');
  if (navToggle && navLinks) {
    navToggle.addEventListener('click', () => {
      const isOpen = navLinks.classList.toggle('open');
      navToggle.setAttribute('aria-expanded', String(isOpen));
    });
    navLinks.querySelectorAll('a').forEach((link) => {
      link.addEventListener('click', () => {
        navLinks.classList.remove('open');
        navToggle.setAttribute('aria-expanded', 'false');
      });
    });
  }

  const WORKER_URL = 'https://accord-vi-verify.accordbccmvi.workers.dev';
  const loadingView = document.getElementById('loadingView');
  const loginView = document.getElementById('loginView');
  const logView = document.getElementById('logView');
  const loginForm = document.getElementById('loginForm');
  const loginBtn = document.getElementById('loginBtn');
  const loginNote = document.getElementById('loginNote');
  const adminPasswordInput = document.getElementById('adminPassword');
  const showPasswordToggle = document.getElementById('showPassword');
  showPasswordToggle.addEventListener('change', () => {
    adminPasswordInput.type = showPasswordToggle.checked ? 'text' : 'password';
  });
  const adminCount = document.getElementById('adminCount');
  const adminSearch = document.getElementById('adminSearch');
  const adminTableBody = document.getElementById('adminTableBody');
  const adminEmpty = document.getElementById('adminEmpty');
  const adminTable = document.getElementById('adminTable');

  let allRegistrations = [];

  function setNote(text, kind) {
    loginNote.textContent = text;
    loginNote.classList.remove('is-error');
    if (kind) loginNote.classList.add(kind);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  // Wraps the first match of `query` in <mark>, working on the already
  // HTML-escaped string so it can't reopen a tag — escape first, search
  // in the escaped text (fine: query never contains the few characters
  // escaping changes), then splice the mark in around that index.
  function highlight(raw, query) {
    const safe = escapeHtml(raw);
    if (!query) return safe;
    const idx = safe.toLowerCase().indexOf(query.toLowerCase());
    if (idx === -1) return safe;
    return safe.slice(0, idx) + '<mark>' + safe.slice(idx, idx + query.length) + '</mark>' + safe.slice(idx + query.length);
  }

  function renderRegistrations(registrations, query) {
    const total = allRegistrations.length;
    adminCount.innerHTML = query
      ? `<strong>${registrations.length}</strong> of ${total} registration${total === 1 ? '' : 's'}`
      : `<strong>${total}</strong> registration${total === 1 ? '' : 's'}`;

    adminTableBody.innerHTML = '';
    if (!registrations.length) {
      adminTable.hidden = true;
      adminEmpty.hidden = false;
      adminEmpty.textContent = query ? `No registrations match "${query}".` : 'No registrations yet.';
      return;
    }
    adminTable.hidden = false;
    adminEmpty.hidden = true;
    registrations.forEach((r, i) => {
      const tr = document.createElement('tr');
      tr.style.animationDelay = `${Math.min(i, 24) * 20}ms`;
      const when = r.submittedAt ? new Date(r.submittedAt).toLocaleString() : '—';
      tr.innerHTML = `
        <td class="admin-cell-when">${escapeHtml(when)}</td>
        <td class="admin-cell-type"><span>${escapeHtml(r.form_type || '—')}</span></td>
        <td>${highlight(r.name || '—', query)}</td>
        <td>${highlight(r.email || '—', query)}</td>
        <td class="admin-cell-details">${escapeHtml(r.details || '—')}</td>
      `;
      adminTableBody.appendChild(tr);
    });
  }

  function applyFilter() {
    const query = adminSearch.value.trim();
    const q = query.toLowerCase();
    const filtered = query
      ? allRegistrations.filter((r) => (r.name || '').toLowerCase().includes(q) || (r.email || '').toLowerCase().includes(q))
      : allRegistrations;
    renderRegistrations(filtered, query);
  }
  adminSearch.addEventListener('input', applyFilter);

  async function loadRegistrations() {
    const res = await fetch(`${WORKER_URL}/admin/registrations`, {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: '{}',
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Could not load registrations');
    return data.registrations;
  }

  function showLog(registrations) {
    allRegistrations = registrations;
    loadingView.hidden = true;
    loginView.hidden = true;
    logView.hidden = false;
    adminSearch.value = '';
    applyFilter();
  }

  function showLogin() {
    loadingView.hidden = true;
    logView.hidden = true;
    loginView.hidden = false;
  }

  // Loading view stays up until we know which way this goes, so an
  // already-signed-in exec never sees the password form flash by first.
  loadRegistrations().then(showLog).catch(showLogin);

  loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const password = document.getElementById('adminPassword').value;
    setNote('Checking…');
    loginBtn.disabled = true;
    fetch(`${WORKER_URL}/admin/login`, {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    })
      .then((res) => res.json())
      .then((data) => {
        if (!data.ok) throw new Error(data.error || 'Incorrect password');
        return loadRegistrations();
      })
      .then((registrations) => {
        setNote('');
        showLog(registrations);
      })
      .catch((err) => setNote(err.message || 'Something went wrong, please try again.', 'is-error'))
      .finally(() => { loginBtn.disabled = false; });
  });

  document.getElementById('logoutBtn').addEventListener('click', () => {
    fetch(`${WORKER_URL}/admin/logout`, {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: '{}',
    }).finally(() => {
      allRegistrations = [];
      document.getElementById('adminPassword').value = '';
      setNote('');
      showLogin();
    });
  });
</script>
</body>
</html>
