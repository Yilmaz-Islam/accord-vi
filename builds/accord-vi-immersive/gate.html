<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accord Gate</title>
<!-- clickjacking guard: shown only when this page is the top-level page, never inside someone else's frame -->
<style id="antiframe">html{display:none!important}</style>
<script>if (self === top) { var a = document.getElementById("antiframe"); if (a) a.remove(); } else { try { top.location = self.location; } catch (e) {} }</script>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/styles.css">
<style>
  body { overscroll-behavior: none; }
  .gt-wrap { max-width: 30rem; margin: 0 auto; padding-bottom: 3rem; }
  .gt-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 16px; padding: 1.4rem 1.3rem; }
  .gt-label { display: block; font-family: var(--font-display); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-dim); margin-bottom: 0.45rem; }
  .gt-input {
    width: 100%; background: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-sm);
    padding: 0.9rem 1rem; color: var(--color-text); font: inherit; font-size: 1.05rem; margin-bottom: 1rem;
  }
  .gt-input:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(224, 180, 85, 0.15); }
  .gt-note { min-height: 1.3em; margin-top: 0.8rem; font-size: 0.9rem; color: var(--color-text-dim); }
  .gt-note.is-error { color: #ff7b80; }

  .gt-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .gt-bar h1 { font-family: var(--font-display); font-size: 1.4rem; margin: 0; }
  /* padding gives a thumb-sized touch area (44px tall); the matching negative margin keeps the layout unchanged */
  .gt-link { appearance: none; border: 0; background: none; color: var(--color-text-dim); font: inherit; font-size: 0.88rem; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 0.8rem 0.6rem; margin: -0.8rem -0.6rem; }

  .gt-cam { position: relative; background: #000; border-radius: 14px; overflow: hidden; aspect-ratio: 1; margin-bottom: 0.9rem; display: grid; place-items: center; }
  .gt-cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .gt-cam[data-on="false"] video { display: none; }
  .gt-frame { position: absolute; inset: 14%; border: 3px solid rgba(224, 180, 85, 0.9); border-radius: 18px; pointer-events: none; box-shadow: 0 0 0 999px rgba(0, 0, 0, 0.28); }
  .gt-cam[data-on="false"] .gt-frame { display: none; }
  .gt-cam-msg { position: relative; padding: 1rem; text-align: center; color: var(--color-text-dim); font-size: 0.95rem; }
  .gt-cam[data-on="true"] .gt-cam-msg { display: none; }
  .gt-btn-row { display: grid; gap: 0.7rem; }

  .gt-section { margin-top: 1.6rem; }
  .gt-results { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.6rem; }
  .gt-result {
    width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; display: block;
    background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 12px; padding: 0.85rem 1rem;
  }
  .gt-result:hover, .gt-result:focus-visible { border-color: var(--color-primary); outline: none; }
  .gt-result b { display: block; font-size: 1.05rem; }
  .gt-result small { color: var(--color-text-dim); }
  .gt-result .is-used { color: #ff7b80; }

  /* the full-screen result: big and obvious in daylight */
  .gt-overlay { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; padding: 1rem; background: rgba(6, 7, 10, 0.86); }
  .gt-overlay[hidden] { display: none; }
  .gt-res { width: min(100%, 30rem); max-height: calc(100dvh - 2rem); display: flex; flex-direction: column; border-radius: 22px; overflow: hidden; background: var(--color-surface); border: 3px solid var(--color-border); text-align: center; box-shadow: 0 24px 70px rgba(0, 0, 0, 0.6); }
  .gt-res-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .gt-ic { width: 1.15em; height: 1.15em; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .gt-res[data-kind="ready"] { border-color: #3fae72; }
  .gt-res[data-kind="admitted"] { border-color: #3fae72; }
  .gt-res[data-kind="used"], .gt-res[data-kind="bad"] { border-color: #e0555a; }
  .gt-res-top { padding: 0.8rem 1rem; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; letter-spacing: 0.08em; text-transform: uppercase; color: #fff; }
  .gt-res[data-kind="ready"] .gt-res-top, .gt-res[data-kind="admitted"] .gt-res-top { background: #2c8a57; }
  .gt-res[data-kind="used"] .gt-res-top, .gt-res[data-kind="bad"] .gt-res-top { background: #b83a3f; }
  .gt-res-body { padding: 1.2rem 1.2rem 0.6rem; }
  .gt-res-name { font-family: var(--font-display); font-size: clamp(1.7rem, 8vw, 2.4rem); font-weight: 700; line-height: 1.15; word-break: break-word; margin: 0 0 0.35rem; }
  .gt-res-ref { margin: 0; color: var(--color-text-faint); font-size: 0.85rem; letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }
  .gt-res-used { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin: 0.9rem 0 0; padding: 0.7rem 0.9rem; border-radius: 12px; background: rgba(224, 85, 90, 0.14); border: 1px solid rgba(224, 85, 90, 0.5); color: #ffb4b6; font-weight: 600; font-size: 1rem; }
  .gt-res-used[hidden] { display: none; }
  /* the details a person can be asked to confirm: who bought it, with which email, when */
  .gt-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; margin: 0.8rem 1.2rem 0; padding: 0; text-align: left; }
  .gt-fact { display: grid; grid-template-columns: auto 1fr; column-gap: 0.6rem; align-items: center; padding: 0.5rem 0.7rem; min-width: 0; border-radius: 12px; background: var(--color-bg); border: 1px solid var(--color-border); }
  .gt-fact.is-wide { grid-column: 1 / -1; }
  .gt-fact .gt-ic { grid-row: span 2; color: var(--color-primary); font-size: 1.1rem; }
  .gt-fact dt { font-family: var(--font-display); font-size: 0.62rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--color-text-faint); }
  .gt-fact dd { margin: 0; font-size: 0.92rem; color: var(--color-text); overflow-wrap: anywhere; line-height: 1.3; }
  .gt-party { margin: 0.9rem 1.2rem 0; text-align: left; }
  .gt-party h3 { font-family: var(--font-display); font-size: 0.66rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--color-text-faint); margin: 0 0 0.45rem; }
  .gt-party[hidden] { display: none; }
  .gt-party ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.3rem; counter-reset: gp; }
  .gt-party li { counter-increment: gp; display: flex; align-items: center; gap: 0.6rem; padding: 0.4rem 0.7rem; border-radius: 10px; border: 1px solid var(--color-border); font-size: 0.92rem; color: var(--color-text-dim); }
  .gt-party li::before { content: counter(gp); display: grid; place-items: center; width: 1.45rem; height: 1.45rem; border-radius: 50%; background: rgba(255,255,255,.07); font-size: 0.72rem; flex: none; }
  .gt-party li.is-you { border-color: var(--color-primary); color: var(--color-text); background: rgba(224, 180, 85, 0.08); }
  .gt-party li.is-you::after { content: "This ticket"; margin-left: auto; color: var(--color-primary); font-size: 0.7rem; font-family: var(--font-display); letter-spacing: 0.05em; text-transform: uppercase; }
  .gt-party li.is-in:not(.is-you)::after { content: "In"; margin-left: auto; color: #5fcf8f; font-size: 0.7rem; font-family: var(--font-display); letter-spacing: 0.05em; text-transform: uppercase; }
  .gt-check { display: flex; align-items: center; gap: 0.8rem; padding: 0.75rem 0.9rem; border: 1px dashed var(--color-primary); border-radius: 12px; text-align: left; font-size: 0.95rem; line-height: 1.3; cursor: pointer; }
  .gt-check[hidden] { display: none; }
  .gt-check input { width: 1.6rem; height: 1.6rem; flex: none; accent-color: var(--color-primary); }
  .gt-res-actions { display: grid; gap: 0.7rem; padding: 0.7rem 1.2rem 1.3rem; border-top: 1px solid var(--color-border); background: var(--color-surface); }
  .gt-big { appearance: none; border: 0; border-radius: 14px; padding: 1.05rem 1rem; font: inherit; font-size: 1.15rem; font-weight: 700; cursor: pointer; }
  .gt-big.is-admit { background: linear-gradient(135deg, #3fae72, #2c8a57); color: #fff; }
  .gt-big.is-cancel { background: transparent; color: var(--color-text-dim); border: 1px solid var(--color-border); font-weight: 600; }
  .gt-big:disabled { opacity: 0.55; }
</style>
  <meta name="theme-color" content="#0e0f12">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="css/apple.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="g-ticket" viewBox="0 0 24 24"><path d="M3 9a2 2 0 0 0 0 6v3h18v-3a2 2 0 0 1 0-6V6H3z"/><path d="M14 6v12" stroke-dasharray="2 2.4"/></symbol>
  <symbol id="g-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.7a3.5 3.5 0 0 1 0 6.6M18 14.3c2.2.6 3.5 2.6 3.5 5.7"/></symbol>
  <symbol id="g-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></symbol>
  <symbol id="g-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
  <symbol id="g-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
  <symbol id="g-wallet" viewBox="0 0 24 24"><path d="M16 4H6a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h12a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2H6"/><circle cx="16.5" cy="13.5" r="1.1"/></symbol>
  <symbol id="g-bank" viewBox="0 0 24 24"><path d="M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></symbol>
  <symbol id="g-cash" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 10v.01M18 14v.01"/></symbol>
  <symbol id="g-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
</svg>

<section class="section" id="main" style="padding-top:1.5rem;">
  <div class="container gt-wrap">

    <!-- sign in -->
    <div id="viewLogin" class="gt-card" hidden>
      <h1 class="page-title" style="font-size:1.6rem;margin-bottom:0.4rem;">Gate sign in</h1>
      <p style="color:var(--color-text-dim);margin-bottom:1.2rem;font-size:0.95rem;">For door staff. Use your admin password, or the gate password if you were given one.</p>
      <form id="formLogin" novalidate>
        <label class="gt-label" for="gatePw">Admin or gate password</label>
        <input class="gt-input" id="gatePw" type="password" autocomplete="current-password" required>
        <button type="submit" class="btn btn-primary btn-block" id="btnLogin">Sign in</button>
        <p class="gt-note" id="noteLogin" role="status"></p>
      </form>
    </div>

    <!-- scanner -->
    <div id="viewScan" hidden>
      <div class="gt-bar"><h1>Gate scanner</h1><button class="gt-link" id="btnSignOut" type="button">Sign out</button></div>

      <div class="gt-cam" id="cam" data-on="false">
        <video id="video" playsinline muted></video>
        <div class="gt-frame"></div>
        <p class="gt-cam-msg" id="camMsg">Camera is off. Tap Start camera, then point it at the QR code on the ticket.</p>
      </div>
      <div class="gt-btn-row">
        <button class="btn btn-primary btn-block" id="btnCam" type="button">Start camera</button>
      </div>
      <p class="gt-note" id="noteScan" role="status"></p>

      <div class="gt-section">
        <label class="gt-label" for="nameSearch">No QR code? Search by name</label>
        <input class="gt-input" id="nameSearch" type="search" placeholder="Type at least 2 letters of the name…" autocomplete="off">
        <ul class="gt-results" id="results"></ul>
      </div>

      <div class="gt-section">
        <label class="gt-label" for="manualCode">Or paste a ticket code</label>
        <input class="gt-input" id="manualCode" type="text" placeholder="A6.…" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="btn btn-ghost btn-block" id="btnManual" type="button">Check code</button>
      </div>
    </div>
  </div>
</section>

<!-- result -->
<div class="gt-overlay" id="overlay" hidden>
  <div class="gt-res" id="res" data-kind="ready" role="dialog" aria-modal="true" aria-labelledby="resTop">
    <div class="gt-res-top" id="resTop"></div>
    <div class="gt-res-scroll">
      <div class="gt-res-body">
        <p class="gt-res-name" id="resName"></p>
        <p class="gt-res-ref" id="resRef"></p>
        <p class="gt-res-used" id="resUsed" hidden></p>
      </div>
      <dl class="gt-facts" id="resFacts"></dl>
      <section class="gt-party" id="resParty" hidden>
        <h3>Everyone on this booking</h3>
        <ol id="resPartyList"></ol>
      </section>
    </div>
    <div class="gt-res-actions">
      <label class="gt-check" id="resCheckWrap" hidden><input type="checkbox" id="resCheck"><span>I checked their ID or student card. The name matches.</span></label>
      <button class="gt-big is-admit" id="btnAdmit" type="button" hidden>Admit</button>
      <button class="gt-big is-cancel" id="btnClose" type="button">Close</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const IS_LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
  const API = IS_LOCAL ? 'http://127.0.0.1:8787' : 'https://accord-vi-verify.accordbccmvi.workers.dev';
  const TOKEN_KEY = 'accord_gate_token';
  const ADMIN_TOKEN_KEY = 'accord_admin_token'; // the same key admin.html uses
  const PASS = { concert: 'Live Concert only (18 Oct)', both: 'Both nights (18 + 19 Oct)' };
  const PERSONA = { student: 'Student', group: 'Group leader', guest: 'Guest', sponsor: 'Sponsor' };
  const METHOD = { jazzcash: ['JazzCash', 'g-wallet'], bank: ['Bank transfer', 'g-bank'], cash: ['Cash', 'g-cash'] };
  const $ = (id) => document.getElementById(id);
  // Either a gate token or an admin token opens the scanner (the server accepts both).
  const getToken = () => { try { return localStorage.getItem(TOKEN_KEY) || localStorage.getItem(ADMIN_TOKEN_KEY) || ''; } catch { return ''; } };
  const setToken = (t) => { try { localStorage.setItem(TOKEN_KEY, t); } catch {} };
  const setAdminToken = (t) => { try { localStorage.setItem(ADMIN_TOKEN_KEY, t); } catch {} };
  // signing out here signs out of both, so a shared phone is not left signed in as an admin
  const clearToken = () => { try { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(ADMIN_TOKEN_KEY); } catch {} };

  async function api(path, body) {
    let res;
    try {
      res = await fetch(API + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${getToken()}` },
        body: JSON.stringify(body || {}),
      });
    } catch {
      return { ok: false, status: 0, error: 'No connection. Check the signal and try again.' };
    }
    const data = await res.json().catch(() => ({}));
    if (res.status === 401 && path !== '/gate/login' && path !== '/admin/login') { signedOut('Your session ended. Please sign in again.'); }
    return { status: res.status, ...data, ok: res.ok && data.ok !== false };
  }

  function note(id, text, isError) { const el = $(id); el.textContent = text || ''; el.classList.toggle('is-error', !!isError); }

  // ---------- sign in / out ----------
  function showLogin() { stopCamera(); $('viewScan').hidden = true; $('viewLogin').hidden = false; }
  function showScan() { $('viewLogin').hidden = true; $('viewScan').hidden = false; }
  function signedOut(msg) { clearToken(); showLogin(); note('noteLogin', msg, true); }
  $('formLogin').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = $('gatePw').value;
    if (!password) { note('noteLogin', 'Enter the gate password.', true); return; }
    $('btnLogin').disabled = true;
    note('noteLogin', 'Checking…');
    // The gate password first (if the gate password has been removed, or it is not
    // that one, the admin password is tried next).
    let r = await api('/gate/login', { password });
    let wrong = false;
    if (r.ok) {
      setToken(r.token);
    } else if (r.status === 401 || r.status === 503) {
      const a = await api('/admin/login', { password });
      if (a.ok) { r = a; setAdminToken(a.token); }
      else if (a.status === 401) { wrong = true; r = a; }
      else { r = a; }
    }
    $('btnLogin').disabled = false;
    if (!r.ok) { note('noteLogin', wrong ? 'Incorrect password' : (r.error || 'Could not sign in.'), true); return; }
    $('gatePw').value = '';
    note('noteLogin', '');
    showScan();
  });
  // Signing out of the scanner goes back to the Terms page with the Executive access popup open.
  // A one-time flag (not a link anyone could guess) tells the Terms page to open it.
  $('btnSignOut').addEventListener('click', () => {
    stopCamera();
    clearToken();
    try { sessionStorage.setItem('accord_open_exec', '1'); } catch {}
    location.href = 'terms.html';
  });

  // ---------- the result card ----------
  let current = null; // the ticket being shown: { id, holderName, seq, of, pass, purchaser, admittedAt, code? }
  let overlayOpen = false;
  const overlay = $('overlay');
  const fmtTime = (iso) => new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const fmtWhen = (iso) => new Date(iso).toLocaleString([], { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
  function ago(iso) {
    const m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
    if (m < 1) return 'just now';
    if (m < 60) return `${m} min ago`;
    const h = Math.round(m / 60);
    return h < 24 ? `${h} h ago` : `${Math.round(h / 24)} d ago`;
  }
  const icon = (id) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('class', 'gt-ic'); s.setAttribute('aria-hidden', 'true'); const u = document.createElementNS('http://www.w3.org/2000/svg', 'use'); u.setAttribute('href', '#' + id); s.appendChild(u); return s; };

  // The details door staff can ask the person about: who bought it, which email, when, how it was paid.
  function fillFacts(ticket) {
    const dl = $('resFacts');
    dl.textContent = '';
    if (!ticket) return;
    const add = (ic, label, value, wide) => {
      if (!value) return;
      const d = document.createElement('div');
      d.className = 'gt-fact' + (wide ? ' is-wide' : '');
      const dt = document.createElement('dt'); dt.textContent = label;
      const dd = document.createElement('dd'); dd.textContent = value;
      d.append(icon(ic), dt, dd);
      dl.appendChild(d);
    };
    const m = METHOD[ticket.payMethod];
    add('g-ticket', 'Pass', PASS[ticket.pass] || ticket.pass, true);
    if (ticket.of > 1) add('g-users', 'Ticket', `${ticket.seq} of ${ticket.of}`);
    add(ticket.persona === 'group' ? 'g-users' : 'g-user', 'Registered as', PERSONA[ticket.persona] || ticket.persona, ticket.of <= 1);
    add('g-mail', 'Bought by', ticket.purchaser + (ticket.purchaserEmail ? '  ·  ' + ticket.purchaserEmail : ''), true);
    if (ticket.confirmedAt) add('g-calendar', 'Confirmed', fmtWhen(ticket.confirmedAt), !m);
    if (m) add(m[1], 'Paid by', m[0], !ticket.confirmedAt);

    const box = $('resParty');
    const list = $('resPartyList');
    list.textContent = '';
    const party = ticket.party || [];
    box.hidden = party.length < 2;
    party.forEach((p) => {
      const li = document.createElement('li');
      li.textContent = p.holderName;
      if (p.you) li.classList.add('is-you');
      if (p.admittedAt) li.classList.add('is-in');
      list.appendChild(li);
    });
  }

  function showResult(kind, ticket, topText) {
    overlayOpen = true;
    current = ticket || null;
    $('res').dataset.kind = kind;
    $('resTop').textContent = topText;
    $('resName').textContent = ticket ? ticket.holderName : '';
    $('resRef').textContent = ticket && ticket.ref ? `Ref ${ticket.ref}` : '';
    const used = $('resUsed');
    used.hidden = !(ticket && ticket.admittedAt && kind === 'used');
    used.textContent = '';
    if (!used.hidden) { used.append(icon('g-clock'), `Already admitted at ${fmtTime(ticket.admittedAt)} (${ago(ticket.admittedAt)})`); }
    fillFacts(kind === 'admitted' ? null : ticket);
    // Must be ticked before Admit works: the ID check is the real protection against a copied QR code.
    $('resCheck').checked = false;
    $('resCheckWrap').hidden = kind !== 'ready';
    $('btnAdmit').hidden = kind !== 'ready';
    $('btnAdmit').disabled = true;
    $('btnClose').textContent = kind === 'ready' ? 'Not a match: close' : kind === 'admitted' ? 'Next' : 'Close';
    overlay.hidden = false;
    $('res').querySelector('.gt-res-scroll').scrollTop = 0;
    if (navigator.vibrate) navigator.vibrate(kind === 'ready' || kind === 'admitted' ? 80 : [120, 80, 120]);
    ($('btnAdmit').hidden ? $('btnClose') : $('resCheck')).focus({ preventScroll: true });
  }
  $('resCheck').addEventListener('change', () => { $('btnAdmit').disabled = !$('resCheck').checked; });
  function closeResult() {
    overlay.hidden = true;
    overlayOpen = false;
    current = null;
  }
  $('btnClose').addEventListener('click', closeResult);

  function showTicket(ticket, code) {
    const t = { ...ticket, code };
    if (t.admittedAt) showResult('used', t, 'Already used: do not admit');
    else showResult('ready', t, 'Valid ticket');
  }

  $('btnAdmit').addEventListener('click', async () => {
    if (!current) return;
    $('btnAdmit').disabled = true;
    const r = await api('/gate/admit', current.code ? { code: current.code } : { id: current.id });
    if (!r.ok) { $('btnAdmit').disabled = false; note('noteScan', r.error || 'Could not admit. Try again.', true); showResult('bad', null, r.error || 'Could not admit'); return; }
    if (r.admitted) {
      showResult('admitted', { ...r.ticket }, 'Admitted');
      setTimeout(() => { if (overlayOpen && $('res').dataset.kind === 'admitted') closeResult(); }, 1600);
    } else {
      showResult('used', r.ticket, 'Already used: do not admit');
    }
  });

  // ---------- looking up a scanned or typed code ----------
  function extractCode(text) {
    const m = /A6\.[A-Za-z0-9_-]{16}\.[A-Za-z0-9_-]{22}/.exec(String(text || ''));
    return m ? m[0] : null;
  }
  async function lookupCode(raw) {
    const code = extractCode(raw);
    if (!code) { showResult('bad', null, 'Not a valid Accord ticket'); return; }
    const r = await api('/gate/lookup', { code });
    if (!r.ok) { showResult('bad', null, r.error || 'Could not check this ticket'); return; }
    if (!r.valid) { showResult('bad', null, 'Not a valid ticket: do not admit'); return; }
    showTicket(r.ticket, code);
  }
  $('btnManual').addEventListener('click', () => { const v = $('manualCode').value.trim(); if (v) { lookupCode(v); $('manualCode').value = ''; } });

  // ---------- name search ----------
  let searchTimer = 0;
  $('nameSearch').addEventListener('input', () => {
    clearTimeout(searchTimer);
    const q = $('nameSearch').value.trim();
    if (q.length < 2) { $('results').textContent = ''; return; }
    searchTimer = setTimeout(async () => {
      const r = await api('/gate/search', { q });
      const list = $('results');
      list.textContent = '';
      if (!r.ok) { note('noteScan', r.error || 'Search failed.', true); return; }
      if (!r.matches.length) { const li = document.createElement('li'); li.className = 'gt-note'; li.textContent = 'No ticket under that name.'; list.appendChild(li); return; }
      r.matches.forEach((m) => {
        const li = document.createElement('li');
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'gt-result';
        const name = document.createElement('b'); name.textContent = m.holderName;
        const sub = document.createElement('small');
        sub.textContent = `${m.of > 1 ? `Ticket ${m.seq} of ${m.of} · ` : ''}bought by ${m.purchaser} · `;
        const state = document.createElement('span');
        state.textContent = m.admittedAt ? `used ${fmtTime(m.admittedAt)}` : 'not used yet';
        if (m.admittedAt) state.className = 'is-used';
        sub.appendChild(state);
        b.append(name, sub);
        // a list row is slim on purpose; tapping it fetches the full details (email, party, when booked)
        b.addEventListener('click', async () => {
          const r = await api('/gate/lookup', { id: m.id });
          if (!r.ok || !r.valid) { showResult('bad', null, r.error || 'Could not open this ticket'); return; }
          showTicket(r.ticket, null);
        });
        li.appendChild(b);
        list.appendChild(li);
      });
    }, 300);
  });

  // ---------- camera scanning ----------
  const video = $('video');
  const camBox = $('cam');
  let stream = null;
  let scanning = false;
  let detector = null;
  let jsQRReady = null;
  let lastCode = '';
  let lastAt = 0;
  const canvas = document.createElement('canvas');
  const ctx2d = canvas.getContext('2d', { willReadFrequently: true });

  function loadJsQR() {
    if (window.jsQR) return Promise.resolve();
    if (!jsQRReady) {
      jsQRReady = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'js/vendor/jsQR.js';
        s.onload = resolve;
        s.onerror = () => reject(new Error('jsQR failed to load'));
        document.head.appendChild(s);
      });
    }
    return jsQRReady;
  }

  async function startCamera() {
    note('noteScan', '');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      note('noteScan', 'This browser cannot use the camera here. Use the name search or paste a code instead.', true);
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false });
    } catch {
      note('noteScan', 'Camera permission was denied. Allow the camera for this page, or use the name search.', true);
      return;
    }
    video.srcObject = stream;
    await video.play().catch(() => {});
    detector = 'BarcodeDetector' in window ? new BarcodeDetector({ formats: ['qr_code'] }) : null;
    if (!detector) { try { await loadJsQR(); } catch { note('noteScan', 'Could not load the QR reader. Use the name search instead.', true); stopCamera(); return; } }
    camBox.dataset.on = 'true';
    $('btnCam').textContent = 'Stop camera';
    scanning = true;
    tick();
  }
  function stopCamera() {
    scanning = false;
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = null;
    video.srcObject = null;
    camBox.dataset.on = 'false';
    $('btnCam').textContent = 'Start camera';
  }
  $('btnCam').addEventListener('click', () => (scanning ? stopCamera() : startCamera()));

  async function readFrame() {
    if (detector) {
      const found = await detector.detect(video);
      return found.length ? found[0].rawValue : '';
    }
    const w = video.videoWidth, h = video.videoHeight;
    if (!w || !h) return '';
    const scale = Math.min(1, 640 / w);
    canvas.width = Math.round(w * scale);
    canvas.height = Math.round(h * scale);
    ctx2d.drawImage(video, 0, 0, canvas.width, canvas.height);
    const img = ctx2d.getImageData(0, 0, canvas.width, canvas.height);
    const hit = window.jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
    return hit ? hit.data : '';
  }

  async function tick() {
    if (!scanning) return;
    if (!overlayOpen && video.readyState >= 2) {
      try {
        const text = await readFrame();
        // ignore the same code seen again within 3 seconds
        if (text && !(text === lastCode && Date.now() - lastAt < 3000)) {
          lastCode = text;
          lastAt = Date.now();
          await lookupCode(text);
        }
      } catch { /* a bad frame is fine, try the next one */ }
    }
    setTimeout(tick, 160);
  }

  document.addEventListener('visibilitychange', () => { if (document.hidden && scanning) stopCamera(); });

  // Keep Tab inside the result card while it is open, so focus cannot wander into the scanner behind it.
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlayOpen) { closeResult(); return; }
    if (e.key !== 'Tab' || !overlayOpen) return;
    const items = Array.from(overlay.querySelectorAll('button, input, a[href], [tabindex]:not([tabindex="-1"])'))
      .filter((x) => !x.disabled && !x.hidden && x.offsetParent !== null);
    if (!items.length) return;
    const first = items[0];
    const last = items[items.length - 1];
    const outside = !overlay.contains(document.activeElement);
    if (e.shiftKey && (document.activeElement === first || outside)) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && (document.activeElement === last || outside)) { e.preventDefault(); first.focus(); }
  });

  // ---------- start ----------
  getToken() ? showScan() : showLogin();
})();
</script>
</body>
</html>
